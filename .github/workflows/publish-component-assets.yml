name: Publish component assets

on:
  push:
    branches: [main]
    paths:
      - 'hardware/mechanics/**/*.step'
      - 'hardware/mechanics/**/*.STEP'
      - 'hardware/mechanics/**/*.stp'
      - 'hardware/mechanics/**/*.STP'
      - 'tools/cad/**'
      - '.github/workflows/publish-component-assets.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: component-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/cad/requirements.txt

      - name: Install CAD conversion dependencies
        run: 'python -m pip install --only-binary=:all: -r tools/cad/requirements.txt'

      - name: Generate web CAD assets
        env:
          MECHANICS_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/hardware/mechanics"
        run: |
          python tools/cad/build_step_catalog.py \
            --input hardware/mechanics \
            --output "$RUNNER_TEMP/component-assets" \
            --public-base-url "$MECHANICS_URL" \
            --require-colors

      - name: Publish generated files beside their STEP sources
        run: |
          find hardware/mechanics -maxdepth 1 -type f \( -name '*.glb' -o -name '*.svg' -o -name 'catalog.json' \) -delete
          cp "$RUNNER_TEMP/component-assets"/*.glb hardware/mechanics/
          cp "$RUNNER_TEMP/component-assets"/*.svg hardware/mechanics/
          cp "$RUNNER_TEMP/component-assets"/catalog.json hardware/mechanics/

      - name: Commit generated CAD assets
        id: commit_assets
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add hardware/mechanics
          if git diff --cached --quiet; then
            echo "Generated CAD assets are already current"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "build: publish STEP web assets"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger the primary Pages workflow
        if: steps.commit_assets.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run copy-hardware-docs.yml --ref main
